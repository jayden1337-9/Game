name: Forgotten World CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pytest
      - name: Run API tests
        env:
          SECRET_KEY: ci-only-test-secret
          SQLITE_PATH: /tmp/forgotten-world-test.sqlite3
          ADMIN_USERNAME: admin1337
        run: python -m pytest -q server/tests
