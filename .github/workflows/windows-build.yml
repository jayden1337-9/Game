name: Unity Windows build

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "server/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "unity/**"
      - "server/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  group: unity-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Unity Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity
          unityVersion: 2022.3.50f1
          targetPlatform: StandaloneWindows64
          buildMethod: ForgottenWorld.Editor.BuildWindows
          allowDirtyBuild: true
      - name: Package game and server source
        run: |
          mkdir -p release
          cp -R unity/Build/Windows release/Windows
          cp README.md release/README.txt
          cp -R server release/server
          rm -rf release/server/tests release/server/__pycache__
          cd release
          zip -r ../ForgottenWorld-Windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ForgottenWorld-Windows-ZIP
          path: ForgottenWorld-Windows.zip
          if-no-files-found: error
          retention-days: 30
